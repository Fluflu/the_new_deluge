 oh_say_does_that_star_spangled_banner_yet_wave_desc:0 "O say, can you see, by the dawn's early light,\nWhat so proudly we hailed at the twilight's last gleaming?\nWhose broad stripes an...\nyou know what, §Rfuck this shit.§! the economy sucks, nothing works properly, Washington just bickers.\n\nAmerica is a §Rshitshow of a nation§! that has failed its founding fathers.\n\nMaybe one day it will return as the §Yshining city on a hill§!, but now? its a §Rtragic train wreck§! that we cannot look away from and we are the goddamn passengers of this express."
