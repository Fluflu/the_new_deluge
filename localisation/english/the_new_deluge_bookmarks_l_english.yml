l_english:
 the_new_world_name:0 "The New World"
 the_new_world_desc:0 "Choose a country and begin the scenario."
 the_new_world_GER_history:0 "After the fall of the Bonapartists, The Kingdom of Prussia succeed to form Greater Germany, subjugating the Habsburgs and creating a Federal State. However, tension growth into few communities. The Kaiser try to maintain the stability but the National Socialists under Rudolf Hess and Hermann Goering began to growth in the assembly, threatening the future of the Empire and it's colonies."
 the_new_world_FRA_history:0 "The Deluge against their ennemies failed. Despite the brave of Napoleon IV in the WW1, the country get surrounded byt it's ennemies, failing to preserve \"La Grandeur de la France\". This new era began with multiple coup, From Petain to the Libertarians and Jacobinists. Many people want to fight for freedom, to avenge a strong and medieval nation. May they come back in the future ?"
 the_new_world_HUN_history:0 "With the fall of the Austrian Empire, rebels decide to recreate a new nation, where anveging is growing. Many Hungarian want to revenge against the German Empire and recreate a Greater Hungary, Arrow Cross lead the country in a tense situation but can get help from France."
 the_new_world_SPR_history:0 "Spain face humiliation after the fall of the Bonapartist regime. Alfonso XIII abdicated and decide to gives hands to the generals with a new regency. Unlike the other monarchies, the Spanish State did preserve it's ties with the new French State."
 the_new_world_SOV_history:0 "The Russian Empire, did crush France, once Again, but the Empire is unstable, found harsh moment face to a ending. The Tsar is now weakened by rebels and war"
 the_new_world_CHI_history:0 "After the Fall of the Qing, Chinese Republic focus to rebuilt the nation. "
 the_new_world_JAP_history:0 "Japan did find a bad way to rebuilt it's nation, libertarians take over the New Republic while the Emperor is still alive. Now, they have to negociate with their worst enemy : China. Did the Sun will find a new dawn ?"
 the_new_world_ENG_history:0 "British Empire is stronger than ever. Churchill did take over the Prime minister cabinet and erase all the oppositions."
